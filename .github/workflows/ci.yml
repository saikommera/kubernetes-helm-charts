name: Helm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "3.14.0"
      - name: Lint all charts
        run: |
          for chart in charts/*/; do
            echo "Linting $chart"
            helm lint "$chart" --strict
          done
      - name: Template render check
        run: |
          for chart in charts/*/; do
            helm template test "$chart"               --set image.repository=test --set image.tag=latest > /dev/null
            echo "$chart OK"
          done

  kubeconform:
    name: Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "3.14.0"
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz             | tar xz -C /usr/local/bin
      - name: Validate manifests
        run: |
          helm template test charts/microservice             --set image.repository=test --set image.tag=latest             | kubeconform -strict -summary -kubernetes-version 1.29.0
